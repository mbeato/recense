<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>recense · activations</title>
<!-- import map MUST be the first script element in <head> —
     precedes every module script element (Pitfall 1: non-negotiable).
     Maps the 'three' bare specifier so vendored addon ESM files resolve locally. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "troika-three-text": "./vendor/troika/troika-three-text.esm.js",
    "troika-three-utils": "./vendor/troika/troika-three-utils.esm.js",
    "troika-worker-utils": "./vendor/troika/troika-worker-utils.esm.js",
    "webgl-sdf-generator": "./vendor/troika/webgl-sdf-generator.esm.js",
    "bidi-js": "./vendor/troika/bidi-js.esm.js"
  }
}
</script>
<link rel="stylesheet" href="./css/styles.css" />
<!-- Single module entry point — all app logic lives in modules/app.js and its imports.
     No inline JS here: window.THREE assignment and UMD injection are in app.js (Plan 07). -->
<script type="module" src="./modules/app.js"></script>
</head>
<body>

<!-- The WebGL canvas host — fixed full-bleed, opacity:0 until the layout settles -->
<div id="graph"></div>

<!-- Flat 2D Obsidian-style doc→doc corpus graph host (READER-04). Hidden by default;
     the #rail-corpus toggle shows it full-window (replacing the 3D brain)
     and hides it again. Owned by modules/corpus.js (vendored 2D force-graph instance). -->
<div id="corpus-graph"></div>

<!-- Stats dashboard takeover (Phase 60, D-01/D-02): full-window surface replacing
     the 3D brain (like #corpus-graph) — Usage | Brain Health tabs, range switcher,
     refresh + "as of" stamp, close. Flat near-opaque surface, NO backdrop-filter
     (60-UI-SPEC Glass Discipline — keeps the D-14 invariant untouched). Hidden by
     default; opened via ctx.openStatsDashboard() (modules/stats-dashboard.js). -->
<div id="stats-view">
  <div id="stats-head">
    <div id="stats-tabs">
      <button id="stats-tab-usage" type="button" class="stats-tab active">Usage</button>
      <button id="stats-tab-health" type="button" class="stats-tab">Brain Health</button>
    </div>
    <div id="stats-range">
      <button type="button" class="stats-range-pill" data-range="7d">7d</button>
      <button type="button" class="stats-range-pill active" data-range="30d">30d</button>
      <button type="button" class="stats-range-pill" data-range="90d">90d</button>
      <button type="button" class="stats-range-pill" data-range="all">all-time</button>
    </div>
    <button id="stats-refresh" type="button" aria-label="Refresh stats" title="Refresh stats">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
    <span id="stats-as-of"></span>
    <button id="stats-close" type="button" aria-label="Close stats" title="Close stats">×</button>
  </div>
  <div id="stats-body">
    <div id="stats-usage-tab" class="stats-tab-panel active"></div>
    <div id="stats-health-tab" class="stats-tab-panel"></div>
  </div>
</div>

<!-- Loading/error indicator (app.js) — standalone, independent of the D-01 chrome below -->
<div id="detail-loading">Initializing graph…</div>

<!-- Event log: hidden by default, now a palette command only (D-14 demoted surface) -->
<div id="log"></div>

<!-- D-01 status chip — top-left; scene center stays clear. SSE dot + live node count;
     the node-type legend folds in on hover only, opacity/max-height, never pushing the
     scene layout (D-02/D-09/D-13). Absorbs the old #panel status row + bottom-left legend. -->
<div id="hud-chip">
  <div class="hud-chip-status">
    <span id="sse-dot"></span>
    <span id="sse-label" class="lbl">connecting…</span>
    <span class="count-wrap"><span class="hud-chip-sep">·</span>
      <span id="ncount" class="stat">—</span> <span class="lbl">nodes</span></span>
  </div>
  <div class="hud-chip-legend">
    <span class="dot dot-entity">●</span> entity&nbsp;
    <span class="dot dot-fact">●</span> fact&nbsp;
    <span class="dot dot-schema">●</span> schema
  </div>
</div>

<!-- D-01/D-02 icon rail — mid-right, docked; one surface absorbing the old floating
     corpus/recenter buttons plus the settings toggle and the ⌘K search entry
     point (D-03 single search surface). 4 icons max, inline outline SVG, currentColor
     only — never amber (activation stays scene-reserved). The reader is no longer
     surfaced here (59-06 founder checkpoint feedback): a single doc is opened from
     the corpus view by clicking a doc, not from standalone rail chrome. Reader
     access is now the ⌘K palette's "Open reader" command only (reader.js itself is
     unchanged — see its null-guarded #btn-reader lookup). -->
<div id="hud-rail">
  <button id="btn-settings" type="button" aria-label="Open settings" title="Open settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>
  </button>
  <!-- Corpus toggle (C1, 34-02): renamed from #btn-corpus into the rail (D-01/D-02
       consolidation) — corpus.js's getElementById lookup + CSS follow this id. -->
  <button id="rail-corpus" type="button" aria-label="Open corpus view" title="Open corpus view">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
  </button>
  <!-- Stats dashboard entry point (D-04 revision, quick-260714-g0s): moved out of the
       settings panel into the rail's view-opening cluster — opens ctx.openStatsDashboard(). -->
  <button id="rail-stats" type="button" aria-label="Open usage stats" title="Open usage stats">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="20" x2="21" y2="20" />
      <line x1="6" y1="20" x2="6" y2="13" />
      <line x1="12" y1="20" x2="12" y2="7" />
      <line x1="18" y1="20" x2="18" y2="16" />
    </svg>
  </button>
  <!-- Recenter camera (quick-260612-v79): renamed from #btn-recenter into the rail
       (D-01/D-02 consolidation) — graph.js's getElementById lookup + CSS follow this id. -->
  <button id="rail-recenter" type="button" aria-label="Recenter view" title="Recenter view">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="5" />
      <line x1="12" y1="19" x2="12" y2="23" />
      <line x1="1" y1="12" x2="5" y2="12" />
      <line x1="19" y1="12" x2="23" y2="12" />
    </svg>
  </button>
  <!-- Search magnifier (D-03 single search surface) — opens the ⌘K palette (hud.js wiring) -->
  <button id="btn-search" type="button" aria-label="Search (⌘K)" title="Search (⌘K)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
  </button>
</div>

<!-- D-01 topics rail — slim left-edge strip; expands on hover, rows populated by
     topics.js (VIZ-08 schema browser), selection routes through ctx.selectNode. -->
<div id="topics-rail"></div>

<!-- Index sidebar host (WIKI-01): left sidebar docked over the corpus graph. Hidden by default;
     the rail starts CLOSED (GAP-6) — corpus shows only the reopen handle (corpus.js →
     ctx.showIndexHandle); the user opens the rail explicitly (→ ctx.openIndexSidebar). No toolbar
     button. The reopen handle (#index-reopen) is created by index.js and appended to the body. -->
<div id="index-panel"></div>

<!-- Tap-to-dismiss layer behind the detail panel -->
<div id="backdrop"></div>

<!-- Node detail panel: right-edge slide-in, hidden by default (D-15) -->
<div id="detail">
  <button id="detail-close" aria-label="Close node detail">×</button>
  <div id="detail-title"></div>
  <div class="meta-grid" id="detail-meta"></div>
  <hr class="divider" />
  <div id="detail-body"></div>
  <hr class="divider" />
  <div id="detail-conns-head">Connections</div>
  <div id="detail-conns"></div>
  <div id="detail-conns-more"></div>
</div>

<!-- Settings panel (44-06): in-app cost-controls surface — D-02 (no IPC), D-03 (frontend consumer) -->
<div id="settings-panel">
  <div id="settings-head">
    <span id="settings-kicker">settings ·</span>
    <button id="settings-close" type="button" aria-label="Close settings" title="Close settings">×</button>
  </div>
  <div id="settings-body"></div>
</div>

<!-- Reader overlay (slice): generated project deep-dive; inline fact-refs select graph atoms -->
<div id="reader">
  <div id="reader-head">
    <span id="reader-meta"><span id="reader-kicker">deep-dive ·</span> <span id="reader-title"></span></span>
    <button id="reader-close" type="button" aria-label="Close reader" title="Close reader">×</button>
  </div>
  <div id="reader-body"></div>
</div>

<!-- ⌘K command palette (Phase 59 Plan 03 / D-03..D-07): Nodes/Topics/Commands
     unified behind one input. Hidden by default; window-mode only (CSS gate +
     palette.js's own .mode-window keydown check, RESEARCH Pitfall 7). -->
<div id="palette-backdrop"></div>
<div id="palette">
  <input id="palette-input" type="text" autocomplete="off"
         placeholder="Search nodes, topics, commands…"
         aria-label="Search nodes, topics, commands" />
  <div id="palette-results" role="listbox" aria-label="Palette results"></div>
  <div id="palette-empty">
    <div id="palette-empty-heading">No matches</div>
    <div id="palette-empty-body">Try a different search term, or press Esc to close.</div>
  </div>
</div>

<!-- Floating hover tooltip -->
<div id="tooltip"></div>

<!-- CC BY-SA attribution required by brain-model.CREDITS.txt — must remain visible -->
<div id="hull-credit">brain model: Nevit Dilmen · CC BY-SA 3.0</div>

</body>
</html>
